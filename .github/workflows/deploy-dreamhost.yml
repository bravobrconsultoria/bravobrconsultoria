
name: Deploy Bravo BR DreamHost

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dreamhost-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar site
        run: npm run check

      - name: Preparar arquivos publicos
        run: |
          mkdir -p publish/assets
          cp index.html foods.html empresarial.html \
             privacidade.html 404.html styles.css \
             app.js robots.txt sitemap.xml \
             .htaccess publish/
          cp -a assets/web assets/fonts publish/assets/
          mkdir -p publish/assets/foods/videos
          cp assets/foods/videos/hero-web.mp4 publish/assets/foods/videos/

      - name: Configurar SSH
        env:
          DEPLOY_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Publicar na DreamHost
        run: |
          rsync -avz \
            --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            publish/ \
            bravobrconsultoria@vps46513.dreamhostps.com:/home/bravobrconsultoria/bravobrconsultoria.com.br/

      - name: Verificar site publicado
        run: |
          curl --fail --silent --show-error --location --max-redirs 5 \
            --retry 3 \
            https://bravobrconsultoria.com.br/ \
            -o /dev/null

          curl --fail --silent --show-error --location --max-redirs 5 \
            https://bravobrconsultoria.com.br/foods \
            -o /dev/null

          curl --fail --silent --show-error --location --max-redirs 5 \
            https://bravobrconsultoria.com.br/empresarial \
            -o /dev/null
